name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://mirror.ponte-x.com/codex-app/releases/26.1120.50957
          for f in Codex-mac-arm64.dmg Codex-mac-x64.dmg OpenAI.Codex_26.1120.6357.0_x64__2p2nqsd0c76g0.Msix OpenAI.Codex_26.1120.6357.0_arm64__2p2nqsd0c76g0.Msix; do
            for q in "" "?n=1" ""; do
              code=$(curl -s -m 20 -o /dev/null -D h.txt -r 0-0 -w '%{http_code} dl=%{size_download}' "$B/$f$q")
              echo "$f$q -> $code $(grep -iE 'cf-cache-status|content-range|cache-control|^age' h.txt | tr -d '\r' | tr '\n' ' ')"
            done
          done
          curl -s -D - -o /dev/null "https://mirror.ponte-x.com/codex-app/latest/release-manifest.json" | grep -iE "^HTTP|cf-cache"
