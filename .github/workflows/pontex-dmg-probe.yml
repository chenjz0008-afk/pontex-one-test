name: PonteX DMG probe
# 临时对照实验：下一次 snapshot 同步会把这个文件删掉。
on:
  push:
    tags: ["pontex-dmg-probe-*"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/checkout@v6
        with: { ref: "pontex-artifacts/macOS-universal", path: art, persist-credentials: false }
      - name: Variants
        run: |
          set -x
          mkdir -p out v
          hdiutil attach -nobrowse -quiet -mountpoint /tmp/px art/*.dmg
          ditto "/tmp/px/PonteX One.app" "v/PonteX One.app"; hdiutil detach -quiet /tmp/px
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q -r tools/dmg/requirements.txt
          # 1) PNG 1x 放进 .background/
          sips -s format png src-tauri/pontex/icons/dmg.tiff --out v/bg.png >/dev/null; sips -z 400 660 v/bg.png >/dev/null
          /tmp/venv/bin/dmgbuild -s tools/dmg/settings.py -D app="v/PonteX One.app" -D icon=src-tauri/pontex/icons/icon.icns -D background=v/bg.png -D format=UDRW "PonteX One P" v/png-rw.dmg
          /tmp/venv/bin/python tools/dmg/finish.py v/png-rw.dmg v/png.dmg
          # 2) 让访达自己设背景（TIFF）
          /tmp/venv/bin/dmgbuild -s tools/dmg/settings.py -D app="v/PonteX One.app" -D icon=src-tauri/pontex/icons/icon.icns -D background=src-tauri/pontex/icons/dmg.tiff -D format=UDRW "PonteX One F" v/f-rw.dmg
          mp=$(hdiutil attach -readwrite -noautoopen v/f-rw.dmg | tail -1 | awk -F'\t' '{print $NF}')
          mkdir -p "$mp/.background" && mv "$mp/.background.tiff" "$mp/.background/background.tiff"
          osascript -e 'tell application "Finder"' -e 'tell disk "PonteX One F"' -e 'open' -e 'set theViewOptions to the icon view options of container window' -e 'set background picture of theViewOptions to file ".background:background.tiff"' -e 'update without registering applications' -e 'delay 3' -e 'close' -e 'end tell' -e 'end tell' && echo "applescript ok"
          sync; sleep 2; hdiutil detach "$mp"
          hdiutil convert v/f-rw.dmg -format ULMO -o v/finder.dmg
      - name: Open each in Finder and screenshot
        run: |
          for d in png finder; do
            osascript -e 'tell application "Finder" to close every window' 2>/dev/null || true
            mp=$(hdiutil attach -noautoopen v/$d.dmg | tail -1 | awk -F'\t' '{print $NF}')
            echo "$d mounted at $mp"; ls -la "$mp" "$mp/.background"
            open "$mp"; sleep 8
            screencapture -x out/$d.png
            hdiutil detach -force -quiet "$mp" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dmg-probe, path: out/* }
