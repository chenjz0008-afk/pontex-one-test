<!doctype html>
<!-- DMG 安装窗口的背景（660×400，渲染 1x / 2x 两张再合成 TIFF）。图标由访达画在 (165,200) 和 (495,200)。 -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(108, 82, 255, .10), rgba(108, 82, 255, 0) 60%),
      linear-gradient(#fbfaff, #ffffff 70%);
    color: #171717; position: relative;
  }
  h1 { position: absolute; top: 40px; left: 0; right: 0; margin: 0; text-align: center; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  h1 span { color: #6c52ff; }
  p { position: absolute; top: 72px; left: 0; right: 0; margin: 0; text-align: center; font-size: 13px; color: #666; }
  svg { position: absolute; left: 268px; top: 186px; }
</style></head><body>
  <h1>PonteX <span>One</span> 经纬即连</h1>
  <p>把 PonteX One 拖到「应用程序」</p>
  <svg width="124" height="28" viewBox="0 0 124 28" aria-hidden="true">
    <path d="M4 14h104" stroke="#b8acff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.1 9"/>
    <path d="M104 5l10 9-10 9" fill="none" stroke="#6c52ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</body></html>
